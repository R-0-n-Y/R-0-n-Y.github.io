<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract rendering of a magnetized accretion disk around a black hole">
  <defs>
    <radialGradient id="sky" cx="72%" cy="45%" r="80%">
      <stop offset="0%"  stop-color="#16304d"/>
      <stop offset="55%" stop-color="#0d1a2b"/>
      <stop offset="100%" stop-color="#070d16"/>
    </radialGradient>
    <linearGradient id="diskA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2E86C1" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#4aa3d8" stop-opacity=".85"/>
      <stop offset="46%"  stop-color="#ffd9a0" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#ff9f5a" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#1B4F72" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="diskB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1B4F72" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#5fb2e0" stop-opacity=".55"/>
      <stop offset="62%"  stop-color="#ffe4bd" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#2E86C1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffe9c9" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#e08a3c" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="700" fill="url(#sky)"/>

  <!-- starfield -->
  <g fill="#cfe2f2">
    <circle cx="120" cy="90"  r="1.4" opacity=".8"/><circle cx="300" cy="180" r="1"   opacity=".5"/>
    <circle cx="460" cy="60"  r="1.2" opacity=".65"/><circle cx="700" cy="130" r="0.9" opacity=".45"/>
    <circle cx="950" cy="70"  r="1.5" opacity=".75"/><circle cx="1180" cy="150" r="1"  opacity=".5"/>
    <circle cx="1400" cy="90" r="1.3" opacity=".7"/><circle cx="1520" cy="240" r="1"  opacity=".45"/>
    <circle cx="80"  cy="420" r="1.1" opacity=".55"/><circle cx="240" cy="600" r="1.3" opacity=".6"/>
    <circle cx="520" cy="640" r="0.9" opacity=".4"/><circle cx="1080" cy="620" r="1.2" opacity=".55"/>
    <circle cx="1350" cy="520" r="1"   opacity=".45"/><circle cx="1560" cy="600" r="1.4" opacity=".6"/>
    <circle cx="640"  cy="330" r="0.8" opacity=".35"/><circle cx="1460" cy="380" r="0.9" opacity=".4"/>
  </g>

  <!-- the whole system, tilted -->
  <g transform="translate(1330,250) scale(0.92)">

    <!-- ambient glow -->
    <ellipse cx="0" cy="0" rx="520" ry="330" fill="url(#glow)" filter="url(#softer)"/>

    <!-- far side of the disk, lensed above the shadow -->
    <g transform="rotate(-14)">
      <path d="M -430 0 A 430 92 0 0 1 430 0 A 430 210 0 0 0 -430 0 Z"
            fill="url(#diskB)" opacity=".9" filter="url(#soft)"/>
    </g>

    <!-- photon ring + shadow -->
    <circle cx="0" cy="0" r="132" fill="#ffcf95" opacity=".30" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="118" fill="#050810"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#ffe0b0" stroke-width="3.5" opacity=".85"/>
    <circle cx="0" cy="0" r="128" fill="none" stroke="#ffb867" stroke-width="1.2" opacity=".45"/>

    <!-- near side of the disk, in front of the shadow -->
    <g transform="rotate(-14)">
      <path d="M -430 0 A 430 210 0 0 0 430 0 A 430 92 0 0 1 -430 0 Z"
            fill="url(#diskA)" opacity=".95" filter="url(#soft)"/>
      <!-- magnetic field / streamline hints -->
      <g fill="none" stroke="#ffe7c4" stroke-opacity=".22" stroke-width="1.1">
        <ellipse cx="0" cy="0" rx="200" ry="46"/>
        <ellipse cx="0" cy="0" rx="270" ry="62"/>
        <ellipse cx="0" cy="0" rx="345" ry="80"/>
        <ellipse cx="0" cy="0" rx="410" ry="95"/>
      </g>
    </g>

    <!-- jet / field lines along the spin axis -->
    <g stroke="#7fc4e8" fill="none" stroke-linecap="round" opacity=".38">
      <path d="M -14 -110 C -70 -240 -110 -330 -96 -430" stroke-width="2"/>
      <path d="M  14 -110 C  70 -240  110 -330  96 -430" stroke-width="2"/>
      <path d="M -14  110 C -70  240 -110  320 -96  400" stroke-width="1.6" opacity=".55"/>
      <path d="M  14  110 C  70  240  110  320  96  400" stroke-width="1.6" opacity=".55"/>
      <path d="M -6 -120 C -30 -250 -46 -350 -40 -450" stroke-width="1.1" opacity=".6"/>
      <path d="M  6 -120 C  30 -250  46 -350  40 -450" stroke-width="1.1" opacity=".6"/>
    </g>
  </g>

  <!-- left-side vignette so text stays readable -->
  <rect width="1600" height="700" fill="url(#vig)"/>
  <defs>
    <linearGradient id="vig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#070d16" stop-opacity=".92"/>
      <stop offset="42%" stop-color="#070d16" stop-opacity=".55"/>
      <stop offset="75%" stop-color="#070d16" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
